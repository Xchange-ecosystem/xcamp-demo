name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted]
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Scan pull request commit range
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          version: 3.97.4
          extra_args: --results=verified,unknown

      # The action's push mode scans only event commits. For push, schedule, and
      # manual runs, invoke the same pinned OSS release over the complete branch.
      - name: Scan complete history
        if: github.event_name != 'pull_request'
        run: |
          docker run --rm \
            -v "$PWD:/repo:ro" \
            ghcr.io/trufflesecurity/trufflehog:3.97.4 \
            git file:///repo --branch HEAD --fail --no-update \
            --github-actions --results=verified,unknown

  deps:
    name: Dependency audit
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted]
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Audit dependencies and validate expiring allowlist
        run: bash .github/scripts/dependency-audit.sh

  actions-pinning:
    name: Action reference pinning
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted]
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true

      - name: Require immutable action references
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r reference; do
            case "$reference" in
              ./*) continue ;;
            esac
            revision=${reference##*@}
            if [[ ! "$revision" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::Action '$reference' is not pinned to a full 40-character commit SHA. Local actions under ./.github/actions are exempt."
              failed=1
            fi
          done < <(grep -RhoE 'uses:[[:space:]]+[^[:space:]#]+' .github/workflows .github/actions | sed -E 's/^uses:[[:space:]]+//' | sort -u)
          exit "$failed"
