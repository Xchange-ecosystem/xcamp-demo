name: Setup project

description: Install Bun when needed and restore exact project dependencies

runs:
  using: composite
  steps:
    - name: Detect existing Bun
      id: bun
      shell: bash
      run: |
        if command -v bun >/dev/null 2>&1; then
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "Using preinstalled $(bun --version)"
        else
          echo "available=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Install Bun
      if: steps.bun.outputs.available != 'true'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.3.11

    - name: Install frozen dependencies
      shell: bash
      run: bun install --frozen-lockfile
